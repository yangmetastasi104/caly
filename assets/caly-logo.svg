<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1117"/>
      <stop offset="1" stop-color="#05080B"/>
    </linearGradient>

    <linearGradient id="glass" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5CE9BA" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="156" y1="150" x2="356" y2="370">
      <stop offset="0" stop-color="#9FF7DA"/>
      <stop offset="0.5" stop-color="#5CE9BA"/>
      <stop offset="1" stop-color="#35C9A0"/>
    </linearGradient>

    <radialGradient id="blobMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CE9BA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5CE9BA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spec" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="10"/>
      <feGaussianBlur stdDeviation="14" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.55" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="24" y="24" width="464" height="464" rx="108"/>
    </clipPath>
  </defs>

  <!-- base tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#base)"/>

  <g clip-path="url(#tileClip)">
    <!-- colour refractions behind the glass -->
    <circle cx="150" cy="140" r="190" fill="url(#blobMint)" filter="url(#soft)"/>
    <circle cx="400" cy="390" r="200" fill="url(#blobBlue)" filter="url(#soft)"/>
    <circle cx="410" cy="130" r="120" fill="url(#blobMint)" opacity="0.5" filter="url(#soft)"/>

    <!-- glass body -->
    <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#glass)" filter="url(#innerShadow)"/>

    <!-- specular sweep -->
    <path d="M76 236 C 76 140, 140 76, 236 76 L 300 76 C 180 96, 110 168, 96 290 Z"
          fill="url(#spec)" opacity="0.55" filter="url(#softSmall)"/>

    <!-- top edge highlight -->
    <path d="M128 62 H 384" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- rim light -->
  <rect x="24.75" y="24.75" width="462.5" height="462.5" rx="107.25"
        fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- glyph: calendar with a C-shaped opening -->
  <g fill="none" stroke="url(#mint)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M356 296 L356 330 A 40 40 0 0 1 316 370 L196 370 A 40 40 0 0 1 156 330 L156 210 A 40 40 0 0 1 196 170 L316 170 A 40 40 0 0 1 356 210 L356 244"/>
    <path d="M156 234 L356 234" stroke-opacity="0.85"/>
    <path d="M206 142 L206 190" stroke-opacity="0.95"/>
    <path d="M306 142 L306 190" stroke-opacity="0.95"/>
  </g>

  <!-- calendar days -->
  <g fill="#9FF7DA">
    <circle cx="206" cy="292" r="10" opacity="0.6"/>
    <circle cx="256" cy="292" r="10" opacity="0.42"/>
    <circle cx="306" cy="292" r="10" opacity="0.6"/>
    <circle cx="206" cy="330" r="10" opacity="0.32"/>
    <circle cx="256" cy="330" r="10" opacity="0.32"/>
  </g>

  <!-- inner glow on glyph -->
  <g fill="none" stroke="#D9FFF2" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M352 300 L352 330 A 36 36 0 0 1 316 366"/>
  </g>
</svg>
